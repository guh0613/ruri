name: Release

on:
  push:
    tags: ['v*']
  # Manual runs produce preview artifacts only. Push a version tag to draft a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            RURI_VERSION="${GITHUB_REF_NAME#v}"
          else
            base="$(python3 -c 'import plistlib; print(plistlib.load(open("Resources/Info.plist", "rb"))["CFBundleShortVersionString"])')"
            RURI_VERSION="$base-dev.$GITHUB_RUN_NUMBER.g${GITHUB_SHA:0:7}"
          fi
          export RURI_VERSION
          mkdir -p build
          cp Resources/Info.plist build/Info.plist
          python3 scripts/configure-app.py build/Info.plist
          echo "version=$RURI_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$RURI_VERSION" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package (${{ matrix.arch }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RURI_BUILD_DIR: .build/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Build and test
        run: |
          scripts/swift-build.sh --force-resolved-versions
          scripts/swift-build.sh test --force-resolved-versions
      - name: Build DMG
        env:
          RURI_VERSION: ${{ needs.metadata.outputs.version }}
          RURI_BUILD_NUMBER: ${{ github.run_number }}
          # Public application ID. Leave unset until Minecraft API access is approved.
          RURI_MICROSOFT_CLIENT_ID: ${{ vars.RURI_MICROSOFT_CLIENT_ID }}
          RURI_SIGN_IDENTITY: '-'
        run: scripts/package-dmg.sh
      - name: Upload DMG and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Ruri-${{ needs.metadata.outputs.version }}-macOS-${{ matrix.arch }}
          path: |
            build/dmg/*.dmg
            build/dmg/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Ruri-${{ needs.metadata.outputs.version }}-macOS-*
          merge-multiple: true
          path: artifacts
      - name: Verify both architectures
        working-directory: artifacts
        run: |
          for arch in arm64 x86_64; do
            sha256sum --check "Ruri-$RELEASE_VERSION-macOS-$arch.dmg.sha256"
          done
      - name: Create release draft
        shell: bash
        run: |
          # Direct commits are included even when there are no merged PRs.
          previous_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..$RELEASE_TAG"
          else
            range="$RELEASE_TAG"
          fi
          git log --no-merges --format='- %s (%h)' "$range" > "$RUNNER_TEMP/release-notes.md"
          # Leave the release as a draft for the owner to edit and publish.
          # Reruns preserve edited notes and never replace a published binary.
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/is-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/is-draft")" != true ]]; then
              echo 'This release is already published; create a new version tag to change its binaries.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft \
              --title "Ruri $RELEASE_VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease="$PRERELEASE"
          fi
