name: Appcast

# Publishing, editing or withdrawing a release rebuilds the Sparkle feeds from
# the published releases. Drafts are never listed.
on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release events check out the tag; the generator on main handles older tags too.
          ref: main
          persist-credentials: false
      - name: Generate appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sparkle-update.py appcast --output build/appcast
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/appcast

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
