name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            arch: arm64
            developer_dir: /Applications/Xcode.app/Contents/Developer
          - runner: macos-26-intel
            arch: x86_64
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      RURI_BUILD_DIR: .build/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Check build configuration
        run: python3 -m unittest discover -s scripts/tests
      - name: Check localization resources
        run: python3 scripts/localization.py --check
      - name: Build all products
        run: scripts/swift-build.sh --force-resolved-versions
      - name: Test
        # Process/timeout fixtures need prompt scheduling on shared runners.
        run: scripts/swift-build.sh test --no-parallel --force-resolved-versions
